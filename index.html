<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cross-Codec Transfer of Pretrained Speech Language Models</title>
  <meta name="description" content="Project page for Cross-Codec Transfer of Pretrained Speech Language Models. Work in progress.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d17;
      --fg: #eef0ff;
      --muted: #9aa0c3;
      --accent-a: #7c5cff;
      --accent-b: #22d3ee;
      --accent-c: #f472b6;
      --card: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 32px 16px;
      position: relative;
    }

    /* Floating gradient blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      z-index: 0;
      animation: float 18s ease-in-out infinite;
    }
    .blob.a { width: 420px; height: 420px; background: var(--accent-a); top: -120px; left: -100px; }
    .blob.b { width: 360px; height: 360px; background: var(--accent-b); bottom: -120px; right: -80px; animation-delay: -6s; }
    .blob.c { width: 280px; height: 280px; background: var(--accent-c); top: 40%; left: 60%; opacity: 0.25; animation-delay: -12s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.08); }
      66% { transform: translate(-30px, 30px) scale(0.95); }
    }

    /* Subtle grid overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 880px;
      width: 100%;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 32px;
    }
    .badge .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #fbbf24;
      box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.6); }
      70% { box-shadow: 0 0 0 10px rgba(251, 191, 36, 0); }
      100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
    }

    h1 {
      font-size: clamp(2rem, 5.5vw, 3.75rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 40px;
    }
    h1 .grad {
      background: linear-gradient(100deg, var(--accent-a), var(--accent-b) 50%, var(--accent-c));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
    }
    @keyframes shine { to { background-position: 200% center; } }

    /* Animated waveform */
    .wave {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 80px;
      margin: 0 auto 40px;
    }
    .wave span {
      display: block;
      width: 5px;
      border-radius: 3px;
      background: linear-gradient(to top, var(--accent-a), var(--accent-b));
      animation: bar 1.2s ease-in-out infinite;
    }
    @keyframes bar {
      0%, 100% { height: 12%; }
      50% { height: 100%; }
    }

    .tagline {
      font-size: 1.125rem;
      color: var(--muted);
      line-height: 1.6;
      max-width: 560px;
      margin: 0 auto 40px;
    }

    .progress {
      width: min(360px, 100%);
      height: 6px;
      margin: 0 auto 44px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
    }
    .progress::after {
      content: "";
      position: absolute;
      top: 0; left: -40%;
      width: 40%; height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, var(--accent-b), var(--accent-a), transparent);
      animation: slide 2.2s ease-in-out infinite;
    }
    @keyframes slide { to { left: 100%; } }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      cursor: not-allowed;
      transition: border-color 0.2s, color 0.2s;
    }
    .links a:hover { border-color: rgba(255,255,255,0.25); color: var(--fg); }
    .links a small {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      font-weight: 500;
      opacity: 0.7;
    }

    footer {
      margin-top: 56px;
      font-size: 13px;
      color: var(--muted);
      opacity: 0.7;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="blob a"></div>
  <div class="blob b"></div>
  <div class="blob c"></div>

  <main>
    <div class="badge"><span class="dot"></span>Work in progress</div>

    <h1>
      <span class="grad">Cross-Codec Transfer</span><br>
      of Pretrained Speech Language Models
    </h1>

    <div class="wave" aria-hidden="true" id="wave"></div>

    <p class="tagline">
      The paper and audio samples are on the way. Check back soon.
    </p>

    <div class="progress" aria-hidden="true"></div>

    <div class="links">
      <a aria-disabled="true">Paper <small>soon</small></a>
      <a aria-disabled="true">Audio Samples <small>soon</small></a>
    </div>

    <footer>&copy; 2026</footer>
  </main>

  <script>
    const wave = document.getElementById("wave");
    const n = 40;
    for (let i = 0; i < n; i++) {
      const s = document.createElement("span");
      const d = Math.sin((i / n) * Math.PI);
      s.style.animationDelay = `${-(i * 0.07).toFixed(2)}s`;
      s.style.animationDuration = `${(0.9 + Math.random() * 0.8).toFixed(2)}s`;
      s.style.opacity = (0.35 + d * 0.65).toFixed(2);
      wave.appendChild(s);
    }
  </script>
</body>
</html>
